name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: set up the JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      # versionName stays in app/build.gradle.kts so F-Droid can read it: the tag must match it.
      - name: check the tag matches the app version
        run: |
          expected="v$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName ($expected)" >&2
            exit 1
          fi
      - name: build the signed release APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          signed_apks=()
          for apk in app/build/outputs/apk/*/release/*.apk; do
            [[ "$apk" == *-unsigned.apk ]] || signed_apks+=("$apk")
          done
          if [ ${#signed_apks[@]} -eq 0 ]; then
            echo "::warning::RELEASE_KEYSTORE_* secrets are not set: publishing the release without APKs"
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${signed_apks[@]}"
